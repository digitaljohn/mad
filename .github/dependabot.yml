# Weekly dependency PRs, grouped so they don't arrive as twelve separate
# notifications for one lockfile refresh.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Grouped like the others. Without this, bumping the four actions the
      # workflows use opened four separate pull requests in one morning.
      actions:
        patterns: ["*"]
