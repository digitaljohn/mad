name: Release

on:
  push:
    tags: ["v*"]
  # Rehearsal: builds and uploads the artifacts to the run, publishes nothing.
  # Only a tag publishes a release.
  workflow_dispatch:

permissions:
  contents: write # required to create the release

# Two tags pushed in quick succession must not race each other into
# `gh release create`. Never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Same constraint as ci.yml: first-party `actions/*` only. Publishing uses the
# `gh` CLI, which is preinstalled on the runners.
jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p 'require("./package.json").version')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Check the tag matches the app version
        # Otherwise a v0.2.0 release can ship a binary that calls itself 0.1.0.
        run: node scripts/set-version.mjs --check "${{ steps.version.outputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Test before shipping
        run: |
          npx tsc --noEmit
          npm run test:coverage

      - name: Require the update signing key
        # With an updater pubkey in tauri.conf.json the bundler *fails* without
        # the matching private key — it does not fall back to unsigned. Better
        # to say so in ten seconds than to die five minutes into a build.
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "The updater is configured, so release builds need the signing key."
            echo "See docs/RELEASING.md — 'Self-update'."
            exit 1
          fi
          echo "signing key present"

      - name: Rust toolchain with both Mac architectures
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-release-universal-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-universal-

      - name: Test the Rust side before shipping
        # The Rust half owns every filesystem operation — the one thing a
        # release must not ship unverified. After the cache step, so the
        # dependency build here warms the same cache the bundle build uses.
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Detect Apple signing credentials
        id: apple
        # All six secrets or none. A partial set is the worst of both worlds:
        # with the certificate but no notarization account the build dies
        # ~6 minutes in; with the account but no certificate it silently
        # ships unsigned while looking configured.
        #
        # Note what this deliberately does NOT do: define APPLE_CERTIFICATE
        # for later steps. Tauri runs `security import` itself whenever it
        # sees that variable, and GitHub sets an absent secret to the empty
        # string rather than omitting it — so merely mentioning it in a shared
        # env block makes the bundler try to import an empty certificate and
        # fail. The local names here (CERT, …) keep that from happening.
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AID: ${{ secrets.APPLE_ID }}
          APW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          present=0; missing=""
          for pair in CERT:APPLE_CERTIFICATE CERT_PW:APPLE_CERTIFICATE_PASSWORD \
                      IDENT:APPLE_SIGNING_IDENTITY AID:APPLE_ID \
                      APW:APPLE_PASSWORD TEAM:APPLE_TEAM_ID; do
            var="${pair%%:*}"; label="${pair#*:}"
            if [ -n "${!var}" ]; then
              present=$((present+1))
            else
              missing="$missing $label"
            fi
          done
          if [ "$present" -eq 6 ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "All six Apple secrets present — the build will be signed and notarized."
          elif [ "$present" -eq 0 ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "No Apple credentials — building unsigned (users allow it once)."
          else
            echo "::error::Apple signing is half-configured ($present of 6 secrets set). Missing:$missing"
            echo "Set all six secrets, or none for an unsigned build. See docs/RELEASING.md."
            exit 1
          fi

      # Two builds, one of which runs. Tauri imports the certificate and
      # notarizes on its own from these variables; the unsigned path must not
      # mention them at all.
      - name: Build, signed and notarized
        if: steps.apple.outputs.signing == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build, unsigned
        if: steps.apple.outputs.signing != 'true'
        env:
          # Only the updater key. No Apple variable may appear here, even empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Collect the artifacts
        id: artifacts
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist-release
          # The .dmg is what people download by hand. The .app.tar.gz and its
          # .sig are what the in-app updater consumes — both are produced by the
          # bundler because createUpdaterArtifacts is on, so don't roll our own.
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} dist-release/ \;
          find "$BUNDLE/macos" -name '*.app.tar.gz' -exec cp {} dist-release/ \;
          find "$BUNDLE/macos" -name '*.app.tar.gz.sig' -exec cp {} dist-release/ \;
          ls -la dist-release

      - name: Write the update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIG_FILE="$(find dist-release -name '*.app.tar.gz.sig' | head -1)"
          TAR_FILE="$(find dist-release -name '*.app.tar.gz' | head -1)"
          if [ -z "$SIG_FILE" ] || [ -z "$TAR_FILE" ]; then
            echo "::error::The build produced no signed update bundle."
            exit 1
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          URL="$BASE/$(basename "$TAR_FILE")"
          SIG="$(cat "$SIG_FILE")"
          NOTES="See https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          # One universal bundle serves every Mac, but the updater looks the
          # platform up by exact target triple — so list all three keys.
          node -e '
            const [version, notes, url, signature] = process.argv.slice(1);
            const platform = { signature, url };
            const manifest = {
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-universal": platform,
                "darwin-aarch64": platform,
                "darwin-x86_64": platform,
              },
            };
            require("fs").writeFileSync(
              "dist-release/latest.json",
              JSON.stringify(manifest, null, 2) + "\n",
            );
          ' "$VERSION" "$NOTES" "$URL" "$SIG"
          cat dist-release/latest.json

      - name: Checksum everything, manifest included
        # After the manifest is written — the one file the updater actually
        # fetches must not be the one file with no published checksum.
        run: |
          cd dist-release && shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Report what was signed
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/mad.app
          echo '### Build' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          lipo -archs "$APP/Contents/MacOS/mad" 2>&1 | sed 's/^/architectures: /' \
            >> "$GITHUB_STEP_SUMMARY" || true
          if codesign -dv "$APP" 2>&1 | grep -q 'Authority=Developer ID'; then
            echo "signing: Developer ID — opens without a Gatekeeper prompt" \
              >> "$GITHUB_STEP_SUMMARY"
            spctl -a -vvv -t install "$APP" 2>&1 | sed 's/^/gatekeeper: /' \
              >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "signing: none — users must allow it once on first launch" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mad-macos-universal
          path: dist-release/
          retention-days: 14

      - name: Publish the release
        id: publish
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SIGNED_NOTE=$'\n> This build is not signed with an Apple Developer ID. macOS will ask you to allow it the first time — see the install notes below.'
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/mad.app
          if codesign -dv "$APP" 2>&1 | grep -q 'Authority=Developer ID'; then
            SIGNED_NOTE=""
          fi
          UPDATE_NOTE=$'\n\nAlready running mad? **mad ▸ Check for Updates…** will fetch this for you.'
          cat > notes.md <<EOF
          ## Install

          Download \`mad_${VERSION}_universal.dmg\`, open it, and drag **mad** to Applications.
          Universal — one binary for both Apple Silicon and Intel.
          ${UPDATE_NOTE}
          ${SIGNED_NOTE}

          <details>
          <summary>If macOS says it cannot check the app for malicious software</summary>

          That is Gatekeeper reacting to an unsigned download, not a problem with
          the app. Either:

          - open **System Settings → Privacy & Security**, scroll down, and click
            **Open Anyway**, or
          - remove the download quarantine yourself:
            \`\`\`bash
            xattr -d com.apple.quarantine /Applications/mad.app
            \`\`\`
          </details>

          Checksums are in \`SHA256SUMS.txt\`.
          EOF
          # A retry after a half-finished publish must not die on "release
          # already exists" — fall back to (re)uploading the assets into it.
          if ! gh release create "v${VERSION}" dist-release/* \
            --title "mad ${VERSION}" \
            --notes-file notes.md \
            --verify-tag; then
            echo "Release exists (or create failed) — uploading assets into it."
            gh release upload "v${VERSION}" dist-release/* --clobber
          fi

      - name: Remove a partial release on failure
        # A release missing assets is worse than none: `latest` resolves to it
        # and the updater 404s. Delete the release (never the tag) so a plain
        # re-run of this workflow can publish cleanly. Scoped to failures of
        # the publish step itself — a re-run of an already-published tag that
        # dies in an earlier step must NOT take the good release down.
        if: ${{ failure() && github.ref_type == 'tag' && steps.publish.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release delete "v${VERSION}" --yes || true
