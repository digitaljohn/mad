name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — types, tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test with coverage
        # The thresholds in vitest.config.ts fail the job on a regression, so
        # this is the gate as well as the report.
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("| Metric | Covered | Count |");
              console.log("| --- | --- | --- |");
              for (const k of ["statements", "branches", "functions", "lines"]) {
                console.log(row(k));
              }
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the bundle
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  rust:
    name: Rust — fmt, clippy, tests, coverage
    # macOS because the app is macOS-first and the Tauri crate builds here
    # without the webkit2gtk system packages a Linux runner would need.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's build script wants the frontend dist to exist.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Configure git for the tests
        # Several tests create throwaway repositories; git needs an identity and
        # permission to use local paths as submodule sources.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global protocol.file.allow always

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml \
            --lcov --output-path lcov.info --summary-only \
            | tee rust-coverage.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Rust coverage'
            echo '```'
            tail -6 rust-coverage.txt || true
            echo '```'
            echo '_The Tauri app shell — `run()`, menu construction and the'
            echo 'blocking native dialogs — cannot execute without a real'
            echo 'window, so it is not counted as testable. See CONTRIBUTING.md._'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: |
            lcov.info
            rust-coverage.txt
          retention-days: 14

  app:
    name: App — release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Proves the thing actually compiles and links for release, which the
      # unit tests alone do not: they never build the binary or run the Tauri
      # build script that validates tauri.conf.json and the capabilities.
      - name: Build
        run: npm run tauri build -- --no-bundle
