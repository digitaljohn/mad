[package]
name = "mad"
version = "0.2.0"
description = "mad — a tiny markdown editor"
authors = ["john"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "mad_lib"
# rlib only: staticlib/cdylib exist for iOS/Android bindings, which this app
# doesn't ship — building them just triples desktop link time.
crate-type = ["rlib"]

[profile.release]
# The dmg is what people download; a smaller, faster binary is worth the
# slower release build.
codegen-units = 1
lto = "thin"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
trash = "5"
ignore = "0.4"
regex = "1"
notify = "8"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
